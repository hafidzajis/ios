name: TradeLog
options:
  bundleIdPrefix: com.hafidzajis
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
packages:
  TradeLogKit:
    path: Packages/TradeLogKit
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your team in Xcode (Signing & Capabilities) or here.
    DEVELOPMENT_TEAM: ""
targets:
  TradeLog:
    type: application
    supportedDestinations: [iOS]
    sources:
      - path: App
        excludes:
          - TradeLog.entitlements
          - Info.plist
          - Resources/TradeLog.storekit
      - path: App/Resources/TradeLog.storekit
        buildPhase: none
    dependencies:
      - package: TradeLogKit
        product: TradeLogCore
      - package: TradeLogKit
        product: TradeLogIntegrations
    entitlements:
      path: App/TradeLog.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TradeLog
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - remote-notification
        ITSAppUsesNonExemptEncryption: false
        NSUbiquitousContainers:
          iCloud.com.hafidzajis.tradelog:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: TradeLog
            NSUbiquitousContainerSupportedFolderLevels: Any
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hafidzajis.tradelog
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  TradeLogTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    sources:
      - AppTests
    dependencies:
      - target: TradeLog
      - package: TradeLogKit
        product: TradeLogCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hafidzajis.tradelog.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TradeLog:
    build:
      targets:
        TradeLog: all
    run:
      config: Debug
      storeKitConfiguration: App/Resources/TradeLog.storekit
    test:
      config: Debug
      targets:
        - TradeLogTests
    archive:
      config: Release
